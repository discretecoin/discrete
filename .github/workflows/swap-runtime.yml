name: Swap runtime qualification

on:
  push:
  pull_request:

jobs:
  offline:
    name: Offline runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime dependencies
        run: python -m pip install -r contrib/atomic-swaps/runtime/requirements.txt
      - name: Run synthetic offline tests and print aggregate counters only
        run: python -B contrib/atomic-swaps/runtime/qualify.py --output swap-runtime-results
