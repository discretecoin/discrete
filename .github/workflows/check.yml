name: Build check

on:
  push:
    branches:
      - '**'
      - '!android' # excludes android
    tags-ignore:
      - '*' # We don't want this to run on release
  pull_request:

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2022

    env:
      BOOST_ROOT: C:\thirdparties\boost-1.86.0

    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1

      - name: Install curl
        run: |
          choco install curl -y

      - name: Download and Install Boost 1.86
        run: |
          $Url = "https://sourceforge.net/projects/boost/files/boost-binaries/1.86.0/boost_1_86_0-msvc-14.3-64.exe"
          $OutputPath = "C:\Users\runneradmin\AppData\Local\Temp\boost-installer.exe"
          curl -L $Url -o $OutputPath
          Start-Process -Wait -FilePath $OutputPath "/SILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=C:\thirdparties\boost-1.86.0"

      - name: Build
        shell: powershell
        id: build
        run: |
          $build_folder = "build"
          $sha = "${{ github.sha }}"
          $krb_ver = $sha.SubString(0,7)
          $release_name = "discrete-cli-win64-$krb_ver"

          mkdir "$build_folder"
          cd "$build_folder"

          if (!(Test-Path "$env:BOOST_ROOT\boost\version.hpp")) {
            throw "Boost headers not found under $env:BOOST_ROOT"
          }

          cmake -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DBOOST_ROOT="$env:BOOST_ROOT" `
            -DBoost_ROOT="$env:BOOST_ROOT" `
            -DOQS_BUILD_ONLY_LIB=ON `
            ..
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed with exit code $LASTEXITCODE" }

          cmake --build . --config Release --target Daemon SimpleWallet GreenWallet PaymentGateService AddressGenerator -- /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed with exit code $LASTEXITCODE" }

          $bin_dir = "src\Release"
          $package_dir = "$release_name"
          $bins = @("discreted.exe", "simplewallet.exe", "greenwallet.exe", "walletd.exe", "vanitygen.exe")
          New-Item -ItemType Directory -Force -Path "$package_dir" | Out-Null
          foreach ($bin in $bins) {
            $path = Join-Path "$bin_dir" "$bin"
            if (!(Test-Path "$path")) {
              throw "Expected binary not found: $path"
            }
            Copy-Item "$path" "$package_dir/"
          }

          Compress-Archive -Path "$package_dir" -DestinationPath "$release_name.zip" -Force
          $sha256 = (Get-FileHash "$release_name.zip").Hash
          $asset_path = "$build_folder/$release_name.zip"

          echo "sha256=${sha256}" >> $env:GITHUB_OUTPUT
          echo "release_name=${release_name}.zip" >> $env:GITHUB_OUTPUT
          echo "asset_path=${asset_path}" >> $env:GITHUB_OUTPUT
          echo "krb_ver=${krb_ver}" >> $env:GITHUB_OUTPUT
          echo "artifact_path=$asset_path" >> $env:GITHUB_OUTPUT

      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.release_name }}
          path: ${{ steps.build.outputs.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mingw:
    name: MinGW
    runs-on: windows-2022
    if: false

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-boost-libs

      - uses: actions/checkout@master
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Prepare version
        shell: powershell
        id: setup
        run: |
          $krb_ver="${{ github.sha }}".SubString(0,7)
          $release_name="discrete-cli-win64-mingw-$krb_ver"

          echo "release_name=${release_name}" >> $env:GITHUB_OUTPUT

      - name: Check Boost
        run: |
          set -e

          echo "MSYSTEM=$MSYSTEM"
          echo "MINGW_PREFIX=$MINGW_PREFIX"
          which cmake
          cmake --version

          pacman -Q | grep boost || true

          echo "Boost regex files:"
          find /mingw64 -iname "*boost*regex*" || true

          echo "Boost system files:"
          find /mingw64 -iname "*boost*system*" || true

          test -d /mingw64/include/boost

      - name: Build
        id: build
        run: |
          set -e

          mkdir -p build
          cd build

          cmake .. \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTATIC=ON \
            -DBOOST_ROOT=/mingw64 \
            -DBoost_INCLUDE_DIR=/mingw64/include \
            -DBoost_LIBRARY_DIR=/mingw64/lib \
            -DBoost_USE_STATIC_LIBS=ON \
            -DBoost_USE_STATIC_RUNTIME=OFF \
            -DBoost_USE_MULTITHREADED=ON \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DBoost_DEBUG=ON

          cmake --build . --config Release --target Daemon SimpleWallet GreenWallet PaymentGateService AddressGenerator -- -j$(nproc)

      - name: Prepare release
        run: |
          set -e

          mkdir -p build/discrete
          for bin in discreted.exe simplewallet.exe greenwallet.exe walletd.exe vanitygen.exe; do
            f="build/src/$bin"
            if [ ! -f "$f" ]; then
              echo "Expected binary not found: $f"
              exit 1
            fi
            mv "$f" build/discrete/
          done

      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.release_name }}
          path: build/discrete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    name: macOS 15 (ARM64)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install Boost ARM64
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: 1.86.0
          platform: macos
          platform_version: 15
          toolset: clang
          arch: aarch64

      - name: Build
        id: build
        run: |
          set -e

          BOOST_ROOT="${{ steps.install-boost.outputs.BOOST_ROOT }}"
          Boost_INCLUDE_DIR="$BOOST_ROOT/include"
          Boost_LIBRARY_DIR="$BOOST_ROOT/lib"

          build_folder="build"
          krb_ver="${GITHUB_SHA::7}"
          release_name="discrete-cli-macos-arm64-$krb_ver"

          brew install openssl@3
          brew link openssl@3 --force

          mkdir -p "$build_folder"
          cd "$build_folder"

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DBOOST_ROOT="$BOOST_ROOT" \
            -DBoost_INCLUDE_DIR="$Boost_INCLUDE_DIR" \
            -DBoost_LIBRARY_DIR="$Boost_LIBRARY_DIR" \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DBoost_USE_STATIC_LIBS=ON \
            -DBoost_COMPILER=-clang \
            -DBoost_ARCHITECTURE=-a64 \
            -DBoost_THREADAPI=pthread

          make -j$(sysctl -n hw.ncpu)

          mkdir "$release_name"

          exeFiles=()
          for f in src/*; do
            if [[ -x "$f" && -f "$f" ]]; then
              strip "$f"
              exeFiles+=( "$f" )
            fi
          done

          cp "${exeFiles[@]}" "$release_name/"

          zip -r "$release_name.zip" "$release_name"

          sha256=$(shasum -a 256 "$release_name.zip" | awk '{print toupper($1)}')

          echo "sha256=$sha256" >> $GITHUB_OUTPUT
          echo "release_name=$release_name.zip" >> $GITHUB_OUTPUT
          echo "artifact_path=$build_folder/$release_name" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.release_name }}
          path: ${{ steps.build.outputs.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ubuntu24:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Build
        id: build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libboost-all-dev libssl-dev pkg-config

          build_folder="build/release"
          krb_ver=${GITHUB_SHA::7}
          release_name=discrete-cli-ubuntu24.04-"$krb_ver"

          mkdir -p "$build_folder"
          cd "$build_folder"

          cmake -D ARCH=default -D CMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG" \
            -D CMAKE_POSITION_INDEPENDENT_CODE:BOOL=true \
            -D BOOST_IGNORE_SYSTEM_PATHS_DEFAULT=ON \
            -D BOOST_ROOT=/usr \
            -DOQS_BUILD_ONLY_LIB=ON \
            ../..

          cmake --build . --config Release --target Daemon SimpleWallet GreenWallet PaymentGateService AddressGenerator -- -j"$(nproc)"

          mkdir -p "$release_name"
          for bin in discreted simplewallet greenwallet walletd vanitygen; do
            f="src/$bin"
            if [[ ! -x "$f" || ! -f "$f" ]]; then
              echo "Expected binary not found: $f"
              exit 1
            fi
            strip "$f"
            cp "$f" "$release_name/"
          done

          echo "release_name=${release_name}" >> $GITHUB_OUTPUT
          echo "artifact_path=$build_folder/$release_name" >> $GITHUB_OUTPUT

      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.release_name }}
          path: ${{ steps.build.outputs.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-static:
    name: Linux universal static
    runs-on: ubuntu-latest

    container:
      image: alpine:3.19
      options: --platform linux/amd64

    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            git \
            build-base \
            cmake \
            boost-dev \
            boost-static \
            openssl-dev \
            openssl-libs-static \
            lmdb-dev \
            linux-headers \
            binutils \
            file

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Mark git repo as safe
        run: git config --global --add safe.directory '*'

      - name: Build static
        id: build
        run: |
          build_folder="build/release"
          krb_ver=$(echo $GITHUB_SHA | cut -c1-7)
          release_name="discrete-cli-linux-universal-$krb_ver"

          mkdir -p "$build_folder"
          cd "$build_folder"

          export CFLAGS="-O3 -static"
          export CXXFLAGS="-O3 -static -static-libstdc++ -static-libgcc"
          export LDFLAGS="-static"

          cmake ../.. \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTATIC=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBoost_USE_STATIC_LIBS=ON \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

          cmake --build . --config Release --target Daemon SimpleWallet GreenWallet PaymentGateService AddressGenerator -- -j"$(nproc)"

          mkdir -p "$release_name"
          for bin in discreted simplewallet greenwallet walletd vanitygen; do
            f="src/$bin"
            if [ ! -x "$f" ] || [ ! -f "$f" ]; then
              echo "Expected binary not found: $f"
              exit 1
            fi
            strip "$f"
            cp "$f" "$release_name/"
          done

          echo "release_name=$release_name" >> $GITHUB_OUTPUT
          echo "artifact_path=$build_folder/$release_name" >> $GITHUB_OUTPUT

      - name: Verify static linkage
        run: |
          FAILED=0

          for bin in discreted simplewallet greenwallet walletd vanitygen; do
            f="build/release/src/$bin"
            echo "=== $f ==="
            file "$f"

            if readelf -d "$f" | grep NEEDED; then
              echo "FAIL: dynamic dependency found"
              FAILED=1
            else
              echo "OK: fully static"
            fi
          done

          if [ "$FAILED" = "1" ]; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.release_name }}
          path: ${{ steps.build.outputs.artifact_path }}
