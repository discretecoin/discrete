name: Release

on:
  push:
    tags:
    - '*'

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1

      - name: Install curl
        run: |
          choco install curl -y

      # Tried MarkusJx/install-boost (GitHub Releases, not SourceForge) first, since
      # it already works for the macOS job below. It doesn't work here: its Windows
      # static-lib packages are compiled against the dynamic CRT (/MD) only, but this
      # project links fully static (/MT, CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      # below) — every Daemon.vcxproj link failed LNK2038 'MD_DynamicRelease' vs
      # 'MT_StaticRelease'. That's a real packaging gap, not a version or lookup
      # issue, so falling back to the known-compatible SourceForge installer.
      #
      # What actually made the old approach fragile wasn't the installer itself, it
      # was fetching it fresh on every run. actions/cache keys on the exact version,
      # so after the first successful run SourceForge is never touched again unless
      # the cache entry is evicted (~7 days unused) or BOOST_VERSION changes — the
      # common case becomes a cache hit with zero network dependency. curl's retry
      # flags cover the remaining cache-miss path, where a single flaky mirror
      # attempt would otherwise fail the whole job.
      - name: Cache Boost installer
        id: boost-installer-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\boost-installer.exe
          key: boost-installer-1.86.0-msvc-14.3-64-v1

      - name: Download Boost installer
        if: steps.boost-installer-cache.outputs.cache-hit != 'true'
        run: |
          $Url = "https://sourceforge.net/projects/boost/files/boost-binaries/1.86.0/boost_1_86_0-msvc-14.3-64.exe"
          $OutputPath = "${{ runner.temp }}\boost-installer.exe"
          curl -L --retry 5 --retry-all-errors --retry-delay 15 --max-time 900 $Url -o $OutputPath

      - name: Install Boost 1.86
        run: |
          Start-Process -Wait -FilePath "${{ runner.temp }}\boost-installer.exe" "/SILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=C:\thirdparties\boost-1.86.0"

      - name: Build
        shell: powershell
        id: build
        run: |
          $build_folder = "build"
          $disc_ver = "${{ github.ref }}" -replace '^refs/tags/', ''
          $release_name = "discrete-cli-win64-$disc_ver"

          $BoostRoot = "C:\thirdparties\boost-1.86.0"

          mkdir "$build_folder"
          cd "$build_folder"
          if (!(Test-Path "$BoostRoot\boost\version.hpp")) {
            throw "Boost headers not found under $BoostRoot"
          }

          # CMAKE_PREFIX_PATH points at the installer's per-version CMake config
          # (lib64-msvc-14.3\cmake\Boost-1.86.0\BoostConfig.cmake), so CMakeLists.txt's
          # find_package(Boost CONFIG ...) succeeds and correctly selects the
          # static-runtime (-s-tagged) library variant. BOOST_ROOT/Boost_ROOT stay as a
          # fallback for the legacy FindBoost.cmake module, in case config-mode lookup
          # ever fails on this runner.
          cmake -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_PREFIX_PATH="$BoostRoot\lib64-msvc-14.3\cmake" `
            -DBOOST_ROOT="$BoostRoot" `
            -DBoost_ROOT="$BoostRoot" `
            -DOQS_BUILD_ONLY_LIB=ON `
            ..
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed with exit code $LASTEXITCODE" }

          cmake --build . --config Release --target Daemon SimpleWallet GreenWallet PaymentGateService AdminTools -- /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed with exit code $LASTEXITCODE" }

          $bin_dir = "src\Release"
          $package_dir = "$release_name"
          $bins = @("discreted.exe", "simplewallet.exe", "greenwallet.exe", "walletd.exe", "admin-tools.exe")
          New-Item -ItemType Directory -Force -Path "$package_dir" | Out-Null
          foreach ($bin in $bins) {
            $path = Join-Path "$bin_dir" "$bin"
            if (!(Test-Path "$path")) {
              throw "Expected binary not found: $path"
            }
            Copy-Item "$path" "$package_dir/"
          }

          Compress-Archive -Path "$package_dir" -DestinationPath "$release_name.zip" -Force
          $sha256 = (Get-FileHash "$release_name.zip").Hash
          $asset_path = "./$build_folder/$release_name.zip"
          echo "sha256=${sha256}" >> $env:GITHUB_OUTPUT
          echo "release_name=${release_name}.zip" >> $env:GITHUB_OUTPUT
          echo "asset_path=${asset_path}" >> $env:GITHUB_OUTPUT
          echo "disc_ver=${disc_ver}" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.asset_path }}
          name: Discrete CLI Suite ${{ steps.build.outputs.disc_ver }}
          append_body: true
          body: |
            [Download for Windows](../../releases/download/${{ steps.build.outputs.disc_ver }}/${{ steps.build.outputs.release_name }}) `SHA256: ${{ steps.build.outputs.sha256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    name: macOS 15 (ARM64)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Boost (ARM64)
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: 1.91.0
          platform: macos
          platform_version: 15
          toolset: clang
          arch: aarch64

      - name: Build
        id: build
        run: |
          set -e

          BOOST_ROOT="${{ steps.install-boost.outputs.BOOST_ROOT }}"
          Boost_INCLUDE_DIR="$BOOST_ROOT/include"
          Boost_LIBRARY_DIR="$BOOST_ROOT/lib"

          build_folder="build"
          disc_ver="${GITHUB_REF#refs/tags/}"
          release_name="discrete-cli-macos-arm64-$disc_ver"

          brew install openssl@3
          brew link openssl@3 --force

          mkdir -p "$build_folder"
          cd "$build_folder"

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DBOOST_ROOT="$BOOST_ROOT" \
            -DBoost_INCLUDE_DIR="$Boost_INCLUDE_DIR" \
            -DBoost_LIBRARY_DIR="$Boost_LIBRARY_DIR" \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DBoost_USE_STATIC_LIBS=ON \
            -DBoost_COMPILER=-clang \
            -DBoost_ARCHITECTURE=-a64 \
            -DBoost_THREADAPI=pthread

          make -j$(sysctl -n hw.ncpu)

          mkdir "$release_name"
          exeFiles=()
          for f in src/*; do
            [[ -x $f && -f $f ]] && strip "$f" && exeFiles+=( "$f" )
          done

          cp "${exeFiles[@]}" "$release_name/"
          zip -r "$release_name.zip" "$release_name"

          sha256=$(shasum -a 256 "$release_name.zip" | awk '{print toupper($1)}')

          echo "sha256=$sha256" >> $GITHUB_OUTPUT
          echo "release_name=$release_name.zip" >> $GITHUB_OUTPUT
          echo "asset_path=$build_folder/$release_name.zip" >> $GITHUB_OUTPUT
          echo "disc_ver=$disc_ver" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.asset_path }}
          name: Discrete CLI Suite ${{ steps.build.outputs.disc_ver }}
          append_body: true
          body: |
            [Download for macOS ARM64](../../releases/download/${{ steps.build.outputs.disc_ver }}/${{ steps.build.outputs.release_name }})  
            `SHA256: ${{ steps.build.outputs.sha256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ubuntu24:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Build
        id: build
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential cmake git libboost-all-dev libssl-dev pkg-config
          build_folder="build/release"
          disc_ver=$(echo "$GITHUB_REF" | sed 's|refs/tags/||')
          release_name=discrete-cli-ubuntu24.04-"$disc_ver"
          mkdir -p "$build_folder"
          cd "$build_folder"
          # DISCRETE_BOOST_PREFER_MODULE: apt's Boost CMake config package silently
          # mislinks static boost_program_options (undefined references / missing
          # vtables at link time), even though it's found successfully — the legacy
          # FindBoost.cmake module links correctly here.
          cmake -D ARCH=default -D CMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG" \
            -D CMAKE_POSITION_INDEPENDENT_CODE:BOOL=true \
            -D BOOST_IGNORE_SYSTEM_PATHS_DEFAULT=ON \
            -D BOOST_ROOT=/usr \
            -D DISCRETE_BOOST_PREFER_MODULE=ON \
            -DOQS_BUILD_ONLY_LIB=ON \
            ../..
          cmake --build . --config Release --target Daemon SimpleWallet GreenWallet PaymentGateService AdminTools -- -j"$(nproc)"

          mkdir -p "$release_name"
          for bin in discreted simplewallet greenwallet walletd admin-tools; do
            f="src/$bin"
            if [[ ! -x "$f" || ! -f "$f" ]]; then
              echo "Expected binary not found: $f"
              exit 1
            fi
            strip "$f"
            cp "$f" "$release_name/"
          done
          tar -czf "$release_name".tar.gz -C "$release_name" .
          sha256=$(shasum -a 256 "$release_name".tar.gz | awk '{print toupper($1)}')
          asset_path="./$build_folder/$release_name.tar.gz"
          echo "sha256=${sha256}" >> $GITHUB_OUTPUT
          echo "release_name=${release_name}.tar.gz" >> $GITHUB_OUTPUT
          echo "asset_path=${asset_path}" >> $GITHUB_OUTPUT
          echo "disc_ver=${disc_ver}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.asset_path }}
          name: Discrete CLI Suite ${{ steps.build.outputs.disc_ver }}
          append_body: true
          body: |
            [Download for Ubuntu 24.04](../../releases/download/${{ steps.build.outputs.disc_ver }}/${{ steps.build.outputs.release_name }}) `SHA256: ${{ steps.build.outputs.sha256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ubuntu-26.04 is a PREVIEW runner image (ubuntu-latest still resolves to
  # 24.04). Don't let a preview-image outage fail a tagged release: the 24.04
  # job above is the authoritative Linux artifact.
  build-ubuntu26:
    name: Ubuntu 26.04
    runs-on: ubuntu-26.04
    if: false
    continue-on-error: true
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Build
        id: build
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential cmake git libboost-all-dev libssl-dev pkg-config
          build_folder="build/release"
          disc_ver=$(echo "$GITHUB_REF" | sed 's|refs/tags/||')
          release_name=discrete-cli-ubuntu26.04-"$disc_ver"
          mkdir -p "$build_folder"
          cd "$build_folder"
          # DISCRETE_BOOST_PREFER_MODULE: apt's Boost CMake config package silently
          # mislinks static boost_program_options (undefined references / missing
          # vtables at link time), even though it's found successfully — the legacy
          # FindBoost.cmake module links correctly here.
          cmake -D ARCH=default -D CMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG" \
            -D CMAKE_POSITION_INDEPENDENT_CODE:BOOL=true \
            -D BOOST_IGNORE_SYSTEM_PATHS_DEFAULT=ON \
            -D BOOST_ROOT=/usr \
            -D DISCRETE_BOOST_PREFER_MODULE=ON \
            -DOQS_BUILD_ONLY_LIB=ON \
            ../..
          cmake --build . --config Release --target Daemon SimpleWallet GreenWallet PaymentGateService AdminTools -- -j"$(nproc)"

          mkdir -p "$release_name"
          for bin in discreted simplewallet greenwallet walletd admin-tools; do
            f="src/$bin"
            if [[ ! -x "$f" || ! -f "$f" ]]; then
              echo "Expected binary not found: $f"
              exit 1
            fi
            strip "$f"
            cp "$f" "$release_name/"
          done
          tar -czf "$release_name".tar.gz -C "$release_name" .
          sha256=$(shasum -a 256 "$release_name".tar.gz | awk '{print toupper($1)}')
          asset_path="./$build_folder/$release_name.tar.gz"
          echo "sha256=${sha256}" >> $GITHUB_OUTPUT
          echo "release_name=${release_name}.tar.gz" >> $GITHUB_OUTPUT
          echo "asset_path=${asset_path}" >> $GITHUB_OUTPUT
          echo "disc_ver=${disc_ver}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.asset_path }}
          name: Discrete CLI Suite ${{ steps.build.outputs.disc_ver }}
          append_body: true
          body: |
            [Download for Ubuntu 26.04](../../releases/download/${{ steps.build.outputs.disc_ver }}/${{ steps.build.outputs.release_name }}) `SHA256: ${{ steps.build.outputs.sha256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-static:
    name: Linux universal static
    runs-on: ubuntu-latest
    container:
      image: alpine:3.19
      options: --platform linux/amd64

    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            git \
            build-base \
            cmake \
            boost-dev boost-static \
            openssl-dev openssl-libs-static \
            lmdb-dev \
            linux-headers \
            binutils \
            file

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Mark git repo as safe
        run: git config --global --add safe.directory '*'

      - name: Build static
        id: build
        run: |
          build_folder="build/release"
          disc_ver=$(echo "$GITHUB_REF" | sed 's|refs/tags/||')
          release_name="discrete-cli-linux-universal-$disc_ver"

          mkdir -p "$build_folder"
          cd "$build_folder"

          export CFLAGS="-O3 -static"
          export CXXFLAGS="-O3 -static -static-libstdc++ -static-libgcc"
          export LDFLAGS="-static"

          # DISCRETE_BOOST_PREFER_MODULE: Alpine's boost-dev CMake config package
          # silently mislinks static boost_program_options at link time (confirmed:
          # the whole component ends up unlinked) even though it's found
          # successfully — the legacy FindBoost.cmake module links correctly here.
          cmake ../.. \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTATIC=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBoost_USE_STATIC_LIBS=ON \
            -DDISCRETE_BOOST_PREFER_MODULE=ON \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

          cmake --build . --config Release --target Daemon SimpleWallet GreenWallet PaymentGateService AdminTools -- -j"$(nproc)"

          mkdir -p "$release_name"
          for bin in discreted simplewallet greenwallet walletd admin-tools; do
            f="src/$bin"
            if [ ! -x "$f" ] || [ ! -f "$f" ]; then
              echo "Expected binary not found: $f"
              exit 1
            fi
            strip "$f"
            cp "$f" "$release_name/"
          done

          tar -czf "$release_name".tar.gz -C "$release_name" .
          sha256=$(sha256sum "$release_name.tar.gz" | awk '{print toupper($1)}')
          asset_path="./$build_folder/$release_name.tar.gz"

          echo "sha256=${sha256}" >> $GITHUB_OUTPUT
          echo "release_name=${release_name}.tar.gz" >> $GITHUB_OUTPUT
          echo "asset_path=${asset_path}" >> $GITHUB_OUTPUT
          echo "disc_ver=${disc_ver}" >> $GITHUB_OUTPUT

      - name: Verify static linkage
        run: |
          FAILED=0
          for bin in discreted simplewallet greenwallet walletd admin-tools; do
            f="build/release/src/$bin"
            echo "=== $f ==="
            file "$f"
            if readelf -d "$f" | grep NEEDED; then
              echo "FAIL: dynamic dependency found"
              FAILED=1
            else
              echo "OK: fully static"
            fi
          done
          if [ "$FAILED" = "1" ]; then
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.asset_path }}
          name: Discrete CLI Suite ${{ steps.build.outputs.disc_ver }}
          append_body: true
          body: |
            [Download Universal Binaries for Linux](../../releases/download/${{ steps.build.outputs.disc_ver }}/${{ steps.build.outputs.release_name }}) `SHA256: ${{ steps.build.outputs.sha256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
