name: Monitor canonical release and deployment gaps

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: release-gap-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build canonical release and deployment report
        id: monitor
        env:
          GH_TOKEN: ${{ secrets.DISCRETE_MONITOR_TOKEN }}
        run: node monitoring/release-gap/monitor.mjs --fail-on-gap=false

      - name: Upload machine-readable and Markdown reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gap-report
          path: |
            release-gap-report.json
            release-gap-report.md
          if-no-files-found: error

      - name: Publish operator issue dashboard
        id: dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DASHBOARD_ASSIGNEE: MatthewFreeman
        run: node monitoring/release-gap/publish-issue.mjs

      - name: Monitor error - verification incomplete
        if: steps.monitor.outputs.monitor_error_count != '0'
        env:
          MONITOR_ERROR_COUNT: ${{ steps.monitor.outputs.monitor_error_count }}
        run: |
          echo "::error title=Release/deployment monitor incomplete::The monitor encountered ${MONITOR_ERROR_COUNT} verification error(s). Open the job summary and operator dashboard."
          exit 1
